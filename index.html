<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DevPlatform</title>
    <link rel="stylesheet" href="css/styles.css">
</head>

<body class="cuerpo-login">

    <main class="contenedor-login">

        <form class="formulario-login" action="dashboard.html" method="get">

            <h1>Dev<span>Platform</span></h1>

            <p class="subtitulo">
                Ingresa tus credenciales para acceder al panel de control
            </p>

            <div class="grupo-formulario">
                <label for="correo">Correo Electrónico *</label>
                <input 
                    type="email" 
                    id="correo" 
                    name="correo"
                    placeholder="ejemplo@sena.edu.co"
                    required>
            </div>

            <div class="grupo-formulario">
                <label for="password">Contraseña *</label>
                <input 
                    type="password" 
                    id="password" 
                    name="password"
                    minlength="6"
                    placeholder="*******"
                    required>
            </div>

            <div class="grupo-formulario">
                <label for="rol">Rol de Desarrollo *</label>

                <select id="rol" name="rol" required>
                    <option value="">Selecciona una opción</option>
                    <option value="frontend">Desarrollador Frontend</option>
                    <option value="backend">Desarrollador Backend</option>
                    <option value="fullstack">Desarrollador Fullstack</option>
                </select>
            </div>

            <div class="terminos">
                <input type="checkbox" id="terminos" required>
                <label for="terminos">
                    Acepto los términos de servicio y políticas d p
                </label>
            </div>

            <button type="submit">
                Ingrer al Dashboard
            </button>

        </form>

    </main>

</body>
</html>
